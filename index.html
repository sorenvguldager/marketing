<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=da/">
  <meta name="robots" content="noindex">
  <title>Redirecting...</title>
  <link rel="alternate" hreflang="da" href="da/">
  <link rel="alternate" hreflang="no" href="no/">
  <link rel="alternate" hreflang="sv" href="sv/">
  <link rel="alternate" hreflang="en" href="en/">
  <link rel="alternate" hreflang="x-default" href="en/">
</head>
<body>
  <script>
    var lang = (navigator.language || navigator.userLanguage || 'da').toLowerCase();
    if (lang.startsWith('no') || lang.startsWith('nb') || lang.startsWith('nn')) {
      window.location.replace('no/');
    } else if (lang.startsWith('sv')) {
      window.location.replace('sv/');
    } else if (lang.startsWith('en')) {
      window.location.replace('en/');
    } else {
      window.location.replace('da/');
    }
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=da/">
  </noscript>
</body>
</html>
