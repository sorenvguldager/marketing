<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      padding: 12px;
      margin: 0;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }
    .add-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    #newFilter {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    #addBtn {
      padding: 6px 12px;
      background: #0066cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    #addBtn:hover { background: #0052a3; }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 300px;
      overflow-y: auto;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #eee;
    }
    li span {
      word-break: break-all;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #cc0000;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
      flex-shrink: 0;
    }
    .empty {
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h2>Filtrér rækker</h2>
  <div class="add-row">
    <input type="text" id="newFilter" placeholder="Indtast tekst der skal skjules...">
    <button id="addBtn">Tilføj</button>
  </div>
  <ul id="filterList"></ul>
  <script src="popup.js"></script>
</body>
</html>
